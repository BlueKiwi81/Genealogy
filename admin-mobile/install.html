<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#3f3329" />
  <meta name="referrer" content="no-referrer" />
  <title>Opening Family Admin</title>
  <style>
    :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4efe7;color:#211d18;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(100%,520px);background:#fffdf8;border:1px solid #d8cec1;border-radius:22px;padding:28px;box-shadow:0 10px 36px rgba(48,38,29,.09)}.mark{width:54px;height:54px;border-radius:16px;background:#5e4935;color:#fff;display:grid;place-items:center;font:700 18px Georgia,serif;margin-bottom:20px}h1{font:700 30px/1.1 Georgia,serif;margin:0 0 12px}p{line-height:1.55;color:#5f554c;margin:0 0 12px}.status{font-weight:700;color:#3f3329}.error{color:#8b2e27}.button{display:block;margin-top:20px;padding:14px 18px;border-radius:13px;background:#5e4935;color:#fff;text-decoration:none;text-align:center;font-weight:700}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="mark" aria-hidden="true">FH</div>
      <h1>Opening Family Admin</h1>
      <p id="status" class="status">Completing your secure sign-in…</p>
      <p id="detail">This should only take a moment. You will be taken straight into the Family Admin companion.</p>
      <a id="fallback" class="button" href="./" hidden>Open Family Admin</a>
    </section>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/+esm';

    const SUPABASE_URL = 'https://jkakvpsiiffnidggcqzc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_h_0XIxzs33psSZTyKPGr8w_aJoVLw92';
    const ENDPOINT = `${SUPABASE_URL}/functions/v1/genealogy-mobile-install`;
    const status = document.getElementById('status');
    const detail = document.getElementById('detail');
    const fallback = document.getElementById('fallback');

    const params = new URLSearchParams(location.hash.replace(/^#/, ''));
    const token = params.get('install_token') || '';
    history.replaceState(null, '', location.pathname + location.search);

    function fail(message) {
      status.textContent = 'The secure link could not be completed.';
      status.classList.add('error');
      detail.textContent = message || 'Please request a fresh Family Admin install link.';
      fallback.hidden = false;
    }

    if (!token) {
      fail('This handoff link is missing or has already been cleared. Please request a fresh install link.');
    } else {
      try {
        const response = await fetch(ENDPOINT, {
          method: 'POST',
          mode: 'cors',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || 'The secure handoff expired or could not be verified.');

        const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
        const { error } = await supabase.auth.setSession({
          access_token: payload.access_token,
          refresh_token: payload.refresh_token,
        });
        if (error) throw error;

        status.textContent = 'Signed in. Opening Family Admin…';
        detail.textContent = 'Your secure handoff has been used and cannot be reused.';
        window.location.replace('./');
      } catch (error) {
        fail(error?.message || 'Please request a fresh Family Admin install link.');
      }
    }
  </script>
</body>
</html>
