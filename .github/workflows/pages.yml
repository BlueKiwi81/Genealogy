name: Deploy family history site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css editor.css registration.css view-enhancements.css fan-polish.css centre-family-polish.css person-photos.css photo-import.css app-v3.js otp-auth-v1.js otp-auth-v2.js tree-pending-overlay-v1.js research-frontier-v1.js tree-ui-polish-v1.js tree-control-deck-v1.js tree-interaction-guard-v1.js centre-navigation-v1.js adaptive-fan-v1.js generation-default-v1.js frontier-alternates-v1.js frontier-details-v1.js profile-intake-v1.js profile-display-v1.js centre-labels.js view-enhancements-v1.js svg-label-sizing-v1.js fan-polish-v1.js centre-family-polish-v1.js centre-family-polish-v2.js centre-card-fit-v1.js fan-family-side-alignment-v1.js source-upload-v1.js sibling-band-v1.js sibling-band-v2.js sibling-family-centre-v1.js family-snapshot-v1.js tree-suggestions-v1.js editor-evidence-v1.js view-state-guard-v1.js person-photos-v1.js photo-import-v1.js editor-v2.js editor-tree-suggestions-v1.js nickname-editor-v1.js _site/
          cp -R admin-mobile _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
